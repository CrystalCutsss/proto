<!doctype html>
<html lang="ru" data-ds-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#000000" />
    <title>Proto Stand · B2B Loans</title>
  </head>
  <body class="ds-root ds-stage hub">
    <main class="hub-content">
      <header class="hub-header">
        <h1 class="hub-title"><span>Proto Stand</span> <span>B2B Loans</span></h1>
      </header>
      <section id="list" class="hub-list" aria-label="Прототипы" aria-live="polite"></section>
    </main>

    <dialog id="changelog" class="hub-dialog ds-stage" aria-labelledby="changelog-title">
      <div class="hub-content hub-dialog-content">
        <header class="hub-dialog-header">
          <div class="hub-card-text">
            <h2 id="changelog-title" class="hub-card-title"></h2>
            <p class="hub-card-meta">Версии и changelog</p>
          </div>
          <button type="button" class="ds-button" data-variant="glass" data-close>Закрыть</button>
        </header>
        <ol id="versions" class="hub-list hub-versions"></ol>
      </div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
