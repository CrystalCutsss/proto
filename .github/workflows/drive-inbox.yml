# Copy design input from Proto/Inbox/<slug>/<version>/ in Google Drive into
# prototypes/<slug>/versions/<version>/design-input/ and open a PR. Frozen versions are refused. ADR-0008.
name: drive-inbox

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Prototype slug (lowercase latin letters, digits, hyphens)
        required: true
        type: string
      version:
        description: Version, e.g. v1
        required: true
        type: string

permissions: {}

concurrency:
  group: drive-inbox
  cancel-in-progress: false

jobs:
  read:
    name: Copy from Inbox
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      target: ${{ steps.target.outputs.target }}
      branch: ${{ steps.target.outputs.branch }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Validate inputs
        id: target
        env:
          SLUG: ${{ inputs.slug }}
          VERSION: ${{ inputs.version }}
        run: node tools/drive/cli.mjs inbox-target --slug "$SLUG" --version "$VERSION"

      - id: drive
        uses: ./.github/actions/drive-setup
        with:
          wif-provider: ${{ vars.GCP_WIF_PROVIDER }}
          service-account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          sa-key-json: ${{ secrets.GCP_SA_KEY_JSON }}
          install-rclone: 'true'

      - name: Preflight
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.drive.outputs.access-token }}
        run: node tools/drive/cli.mjs preflight

      - name: Copy
        env:
          SOURCE: ${{ steps.target.outputs.source }}
          TARGET: ${{ steps.target.outputs.target }}
          RCLONE: ${{ steps.drive.outputs.rclone }}
        run: |
          set -euo pipefail
          cfg=config/drive.json
          src=":drive:$(jq -r .inboxFolderName "$cfg")/$SOURCE"
          common=(
            --drive-env-auth
            --drive-scope drive.readonly
            --drive-root-folder-id "$(jq -r .protoFolderId "$cfg")"
            --drive-export-formats "$(jq -r .sync.exportFormats "$cfg")"
            --drive-skip-shortcuts
          )
          if ! "$RCLONE" lsjson "$src" "${common[@]}" --max-depth 1 > /dev/null; then
            echo "::error title=drive-inbox::Folder not found in Drive: Proto/$(jq -r .inboxFolderName "$cfg")/$SOURCE"
            exit 1
          fi
          "$RCLONE" copy "$src" "$RUNNER_TEMP/out/$TARGET" "${common[@]}" \
            --max-size "$(jq -r .sync.maxFileSizeBytes "$cfg")B" --stats-one-line -v
          if [ -z "$(find "$RUNNER_TEMP/out/$TARGET" -type f -print -quit)" ]; then
            echo "::error title=drive-inbox::Proto/$(jq -r .inboxFolderName "$cfg")/$SOURCE is empty."
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inbox
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 3

  pr:
    name: Open PR
    needs: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Replace the previous design input
        env:
          TARGET: ${{ needs.read.outputs.target }}
        run: rm -rf "$TARGET"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: inbox
          path: .

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: ${{ needs.read.outputs.branch }}
          delete-branch: true
          add-paths: ${{ needs.read.outputs.target }}
          commit-message: 'chore(inbox): design input for ${{ inputs.slug }} ${{ inputs.version }}'
          title: 'chore(inbox): design input for ${{ inputs.slug }} ${{ inputs.version }}'
          body: |
            Automated by the `drive-inbox` workflow: copied `Proto/Inbox/${{ inputs.slug }}/${{ inputs.version }}/` from Google Drive (read-only, ADR-0008).

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          labels: drive
